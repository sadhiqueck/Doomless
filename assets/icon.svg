<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#fe-grad)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- ശ്രദ്ധ Typography (Focus / Mindfulness) -->
  <text x="64" y="65" text-anchor="middle" dominant-baseline="central" font-family="'RIT Rachana', 'Meera', 'Noto Sans Malayalam', sans-serif" font-weight="700" font-size="38" fill="#ffffff" letter-spacing="-0.5">ശ്രദ്ധ</text>
  
  <!-- Emerald Focus Indicator Dot -->
  <circle cx="64" cy="102" r="5" fill="#10b981"/>
  <circle cx="64" cy="102" r="8" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
