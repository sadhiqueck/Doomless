<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Focus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <span class="logo">📌</span>
      <h1 class="title">Focus Mode</h1>
      <label class="switch">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>
    <div class="site-list">
      <div class="site-row">
        <span>YouTube</span>
        <label class="switch sm"><input type="checkbox" id="siteYT" checked><span class="slider"></span></label>
      </div>
      <div class="site-row">
        <span>Instagram</span>
        <label class="switch sm"><input type="checkbox" id="siteIG" checked><span class="slider"></span></label>
      </div>
      <div class="site-row">
        <span>TikTok</span>
        <label class="switch sm"><input type="checkbox" id="siteTT" checked><span class="slider"></span></label>
      </div>
    </div>
    <div id="statusMessage">Active on selected sites</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
